<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="পাঠশালা">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9333EA"/>
      <stop offset="1" stop-color="#5B21B6"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F0E4FF"/>
    </linearGradient>
  </defs>
  <rect x="5" y="5" width="118" height="118" rx="32" fill="url(#tile)"/>
  <rect x="13" y="13" width="102" height="102" rx="26" fill="none" stroke="#EDE3FC" stroke-opacity=".48" stroke-width="1.5"/>

  <!-- Open pages form a path upward through the center seam. -->
  <path d="M23 45c13-6 25-5 38 3v44c-13-7-25-8-38-2z" fill="url(#page)"/>
  <path d="M105 45c-13-6-25-5-38 3v44c13-7 25-8 38-2z" fill="url(#page)"/>
  <path d="M61 48v44M67 48v44" stroke="#6D28D9" stroke-width="2" stroke-linecap="round" opacity=".62"/>

  <!-- Three waypoints create a distinctive learning-journey monogram. -->
  <path d="M37 77 51 65l13 8 18-20" fill="none" stroke="#7C3AED" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="37" cy="77" r="4.5" fill="#C084FC" stroke="#6D28D9" stroke-width="1.5"/>
  <circle cx="51" cy="65" r="4.5" fill="#C084FC" stroke="#6D28D9" stroke-width="1.5"/>
  <circle cx="64" cy="73" r="4.5" fill="#C084FC" stroke="#6D28D9" stroke-width="1.5"/>
  <circle cx="82" cy="53" r="5" fill="#9333EA" stroke="#FFFFFF" stroke-width="2"/>
</svg>
